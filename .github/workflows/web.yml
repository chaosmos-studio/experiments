name: Test and publish experiments

on:
  push:
    branches: [main]
    paths: ["**", "!**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-site
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.5.2

jobs:
  build:
    # The org variable RUNNER moves the builds onto a self-hosted runner, to save the plan's minutes.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - game: rivet
            marker: rivet-campaign
          - game: tessera
            marker: tessera-version
          - game: hinge-grove
            marker: hinge-grove-version
    defaults:
      run:
        working-directory: experiments/${{ matrix.game }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A self-hosted runner keeps Godot and the templates between jobs, so each is fetched once. Its
      # connection can cut a large download short while curl still exits 0, so a file resumes until its
      # checksum matches. No sudo: Godot goes into the tool cache and onto the PATH.
      - name: Install pinned Godot and web templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          fetch() {
            for _ in 1 2 3 4 5 6; do
              curl --fail --silent --show-error --location --retry 3 -C - "$base/$1" -o "$RUNNER_TEMP/$1" || true
              echo "$2  $RUNNER_TEMP/$1" | sha256sum --check --quiet && return 0
            done
            rm -f "$RUNNER_TEMP/$1"
            return 1
          }
          tools="$RUNNER_TOOL_CACHE/godot/${GODOT_VERSION}"
          if [ ! -x "$tools/godot" ]; then
            fetch "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" 87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03
            unzip -q -o "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -d "$RUNNER_TEMP/godot"
            mkdir -p "$tools"
            install -m 755 "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$tools/godot"
          fi
          echo "$tools" >> "$GITHUB_PATH"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$template_dir/web_nothreads_release.zip" ]; then
            fetch "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" ea50e5183f057d42b22120d0d0340205b98f51f8ff13c33c70fd4ac9077d2019
            mkdir -p "$template_dir"
            unzip -j -q -o "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" 'templates/web_nothreads_*' 'templates/version.txt' -d "$template_dir"
            rm -f "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          fi
      - name: Import and test
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/import.log"
          timeout 120s godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee "$RUNNER_TEMP/tests.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/tests.log"
          grep -q 'failures=0' "$RUNNER_TEMP/tests.log"
      - name: Audit Hinge Grove campaign
        if: matrix.game == 'hinge-grove'
        run: python3 tools/audit_levels.py
      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          touch build/.gdignore
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee "$RUNNER_TEMP/export.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/export.log"
          python3 tools/prepare_web.py
          grep -q '${{ matrix.marker }}' build/web/index.html
          test -f build/web/index.js
          test -f build/web/index.pck
      # --with-deps installs system libraries through apt, which only GitHub's Ubuntu machines have.
      - name: Test desktop and mobile browsers
        run: |
          npm ci
          if [ "$RUNNER_ENVIRONMENT" = "github-hosted" ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
          npx playwright test
      - name: Keep Hinge Grove review frames
        if: matrix.game == 'hinge-grove'
        run: |
          mkdir -p build/web/review
          for frame in 01-guidance 02-drag-preview 03-roots 04-petals-opening 05-bloom 06-recovery 07-settings 08-small-phone garden-30; do
            cp test-results/*-mobile/"$frame.png" "build/web/review/$frame.png"
          done
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-checks-${{ matrix.game }}
          path: experiments/${{ matrix.game }}/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-${{ matrix.game }}
          path: experiments/${{ matrix.game }}/build/web/
          if-no-files-found: error
          retention-days: 14

  # Deploys only once all builds pass, one after the other.
  deploy:
    needs: build
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download web builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: web-*
          path: site
      - name: Deploy to chaosmos.studio/experiments/rivet/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: chaosmos-studio/chaosmos-studio.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          branch: gh-pages
          folder: site/web-rivet
          target-folder: experiments/rivet
          force: false
          attempt-limit: 10
          commit-message: Update Rivet's web build
      - name: Deploy to chaosmos.studio/experiments/tessera/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: chaosmos-studio/chaosmos-studio.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          branch: gh-pages
          folder: site/web-tessera
          target-folder: experiments/tessera
          force: false
          attempt-limit: 10
          commit-message: Update Tessera's web build
      - name: Deploy to chaosmos.studio/experiments/hinge-grove/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: chaosmos-studio/chaosmos-studio.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          branch: gh-pages
          folder: site/web-hinge-grove
          target-folder: experiments/hinge-grove
          force: false
          attempt-limit: 10
          commit-message: Update Hinge Grove's web build
