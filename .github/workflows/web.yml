name: Test and publish experiments

on:
  push:
    branches: [main]
    paths: ["**", "!**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-site
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.5.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - game: rivet
            marker: rivet-campaign
          - game: tessera
            marker: tessera-version
    defaults:
      run:
        working-directory: experiments/${{ matrix.game }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Godot and web templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          echo '87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  /tmp/godot.zip' | sha256sum --check
          echo 'ea50e5183f057d42b22120d0d0340205b98f51f8ff13c33c70fd4ac9077d2019  /tmp/templates.tpz' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -j -q /tmp/templates.tpz 'templates/web_nothreads_*' 'templates/version.txt' -d "$template_dir"
      - name: Import and test
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/import.log
          timeout 120s godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/tests.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/tests.log
          grep -q 'failures=0' /tmp/tests.log
      - name: Export web build
        run: |
          set -euo pipefail
          mkdir -p build/web
          touch build/.gdignore
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee /tmp/export.log
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/export.log
          python3 tools/prepare_web.py
          grep -q '${{ matrix.marker }}' build/web/index.html
          test -f build/web/index.js
          test -f build/web/index.pck
      - name: Test desktop and mobile browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-checks-${{ matrix.game }}
          path: experiments/${{ matrix.game }}/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-${{ matrix.game }}
          path: experiments/${{ matrix.game }}/build/web/
          if-no-files-found: error
          retention-days: 14

  # Deploys only once both builds pass, one after the other.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download web builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: web-*
          path: site
      - name: Deploy to chaosmos.studio/experiments/rivet/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: chaosmos-studio/chaosmos-studio.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          branch: gh-pages
          folder: site/web-rivet
          target-folder: experiments/rivet
          force: false
          attempt-limit: 10
          commit-message: Update Rivet's web build
      - name: Deploy to chaosmos.studio/experiments/tessera/
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: chaosmos-studio/chaosmos-studio.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          branch: gh-pages
          folder: site/web-tessera
          target-folder: experiments/tessera
          force: false
          attempt-limit: 10
          commit-message: Update Tessera's web build
