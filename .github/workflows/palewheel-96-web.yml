name: Test and publish Palewheel 96

on:
  pull_request:
    paths:
      - .github/workflows/palewheel-96-web.yml
      - experiments/palewheel-96/**
  push:
    branches: [main]
    paths:
      - .github/workflows/palewheel-96-web.yml
      - experiments/palewheel-96/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Godot 4.7
        run: |
          set -euo pipefail
          curl -fLsS https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo '0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c  '"$RUNNER_TEMP/godot.zip" | sha256sum --check --quiet
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          install -m 755 "$RUNNER_TEMP/Godot_v4.7-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Import, play through, and export
        working-directory: experiments/palewheel-96
        run: |
          set -euo pipefail
          mkdir -p build/web
          touch build/.gdignore
          godot --headless --editor --path . --import --quit 2>&1 | tee "$RUNNER_TEMP/palewheel96-import.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/palewheel96-import.log"
          godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee "$RUNNER_TEMP/palewheel96-tests.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/palewheel96-tests.log"
          grep -Eq '[1-9][0-9]* passed, 0 failed' "$RUNNER_TEMP/palewheel96-tests.log"
          godot --headless --path . --export-release Web build/web/index.html 2>&1 | tee "$RUNNER_TEMP/palewheel96-export.log"
          ! grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$RUNNER_TEMP/palewheel96-export.log"
          grep -aq ECFG build/web/index.pck
          python3 tools/prepare_web.py
          test -s build/web/wasm-loader.js
      - name: Check phone browser loading and touch
        working-directory: experiments/palewheel-96
        run: |
          set -euo pipefail
          npm ci
          export CHROME_PATH="$(command -v google-chrome)"
          npm run test:web
      - name: Upload phone screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: palewheel-96-phone-check
          path: experiments/palewheel-96/test-results/mobile.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish Palewheel 96
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          repository-name: chaosmos-studio/chaosmos-studio.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          branch: gh-pages
          folder: experiments/palewheel-96/build/web
          target-folder: experiments/palewheel-96
          force: false
          attempt-limit: 10
          commit-message: Publish Palewheel 96
